<style>
   *{
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body{
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    font-family: "Courier New", monospace;
    background-image: url(assets/images/indexbg.jpg);
    background-position: center;
}

/* Paglutang ng hearts*/
.hearts span{
    position: absolute;
    color: #ff5c96;
    font-size:  50px;
    animation: float 6s linear infinite;
    opacity: 1;
}
.hearts span:nth-child(1){
    left: 10%;
    animation-delay: 0s;
}
.hearts span:nth-child(2){
    left: 25%;
    animation-delay: 2s;
}
.hearts span:nth-child(3){
    left: 45%;
    animation-delay: 4s;
}
.hearts span:nth-child(4){
    left: 65%;
    animation-delay: 1s;
}
.hearts span:nth-child(5){
    left: 80%;
    animation-delay: 3s;
}
.hearts span:nth-child(6){
    left: 90%;
    animation-delay: 5s;
}
@keyframes float{
    0%{transform: translateY(110vh) rotate(0deg);}
    100%{transform: translateY(-20vh) rotate(360deg);}
}

/*Computer Window*/
.computer-window{
    width: 90%;
    max-width: 650px;
    background: #fff7fb;
    border: 3px solid #3d2430;
    border-radius: 12px;
    box-shadow: 
        10px 10px 0px #d98ba8,
        0 0 40px rgba(255, 105, 160, 0.25);
    animation: appear 1s ease;
}
@keyframes appear{
    from{
        opacity: 0;
        transform: scale(0.8);
    }
    to{
        opacity: 1;
        transform: scale(1);
    }
}

/*Window Header*/
.window-header{
    height: 45px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0 15px;
    background: #ffb6d2;
    border-bottom: 3px solid #3d2430;
    font-weight: bold;
}
.window-buttons{
    display: flex;
    gap: 8px;
}
.window-buttons span{
    width: 25px;
    height: 25px;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #ffe5ef;
    border: 2px solid #3d2430;
    cursor: default;
}

/*Main Content*/
.window-content {
    position: relative;
    text-align: center;
    padding: 60px 30px 70px;
    /* Glass effect */
    background: linear-gradient(
        135deg,
        rgba(255, 255, 255, 0.55),
        rgba(255, 182, 210, 0.25)
    );
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    border-radius: 0 0 9px 9px;
    /* Glass border */
    border-top: 1px solid rgba(255, 255, 255, 0.7);
    /* Glass shadow */
    box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.8),
        inset 0 -1px 0 rgba(255, 255, 255, 0.2);
}
.pixel-heart{
    font-size: 70px;
    color: #ff5c96;
    animation: heartbeat 1.5s infinite;
}
@keyframes heartbeat{
    0%, 100%{
        transform: scale(1);
    }
    50% {
        transform: scale(1.15);
    }
}
h1{
    margin-top: 20px;
    color: #fc77b7;
    font-size: clamp(24px, 5vw, 38px);
}
.subtitle{
    margin-top: 20px;
    color: #ff99be;
    font-size: 16px;
    line-height: 1.6;
}
.small-text{
    margin-top: 10px;
    color: #9b6578;
}

/*Start Button*/
#startButton {
    margin-top: 30px;
    padding: 14px 28px;
    background: #ff8fba;
    color: white;
    border: 3px solid #3d2430;
    border-radius: 8px;
    font-family: "Courier New", monospace;
    font-weight: bold;
    cursor: pointer;
    box-shadow: 5px 5px 0px #3d2430;
    transition: 0.2s;
}
#startButton:hover {
    transform: translate(3px, 3px);
    box-shadow: 2px 2px 0px #3d2430;
}
#startButton:active {
    transform: translate(5px, 5px);
    box-shadow: none;
}

/*=========================
    ENVELOPE SECTION
===========================*/

.envelope-section {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    background:
        radial-gradient(
            circle at center,
            #fff0f7,
            #ffd9e9
        );
    opacity: 0;
    visibility: hidden;
    transition: opacity 0.7s ease;
}
.envelope-section.show {
    opacity: 1;
    visibility: visible;
}

/* Envelope */
.envelope-wrapper {
    position: relative;
    width: 320px;
    height: 220px;
    cursor: pointer;
    animation: envelopeFloat 3s ease-in-out infinite;
}
.envelope {
    position: absolute;
    width: 100%;
    height: 180px;
    bottom: 20px;
    background: #ff9fc2;
    border: 3px solid #3d2430;
    border-radius: 8px;
    box-shadow: 8px 8px 0 #d98ba8;
}
.envelope-flap {
    position: absolute;
    top: -3px;
    left: -3px;
    width: calc(100% + 6px);
    height: 100px;
    background: #ffb6d2;
    border: 3px solid #3d2430;
    clip-path: polygon(
        0 0,
        100% 0,
        50% 100%
    );
    transform-origin: top center;
    transition: transform 0.7s ease;
    z-index: 3;
}
/* Letter */

.letter {
    position: absolute;
    width: 85%;
    height: 130px;
    left: 7.5%;
    top: 25px;
    background: #fffafc;
    border: 2px solid #3d2430;
    border-radius: 5px;
    display: flex;
    justify-content: center;
    align-items: center;
    text-align: center;
    transition: transform 0.7s ease;
    z-index: 2;
}
.letter-text {
    color: #5b3442;
    font-size: 15px;
    line-height: 1.6;
}

/* Shadow */




/*Responsive*/
@media (max-width: 768px) {
    .window-content {
        padding: 45px 20px 55px;
    }
 
    .pixel-heart {
        font-size: 55px;
    }
 
    .hearts span {
        font-size: 36px;
    }
}
 
@media (max-width: 480px) {
    .computer-window {
        width: 94%;
    }
 
    .window-header {
        height: 38px;
        padding: 0 10px;
        font-size: 14px;
    }
 
    .window-content {
        padding: 35px 16px 45px;
    }
 
    .pixel-heart {
        font-size: 44px;
    }
 
    #startButton {
        padding: 12px 22px;
        font-size: 14px;
    }
 
    .envelope-wrapper {
        width: 260px;
        height: 190px;
    }
 
    .letter-text {
        font-size: 13px;
    }
}




/* Floating */
@keyframes envelopeFloat {
    0%, 100% {
        transform: translateY(0);
    }
    50% {
        transform: translateY(-12px);
    }
}

.subtitle {
    font-size: clamp(13px, 3.5vw, 16px);
}

@media (max-height: 700px) {
  body {
    overflow-y: auto;
  }

  .window-content {
    padding: 30px 20px 35px;
  }

  .pixel-heart {
    font-size: 40px;
  }

  h1 {
    margin-top: 12px;
  }

  .subtitle {
    margin-top: 12px;
  }

  #startButton {
    margin-top: 18px;
  }
}
</style>

    const startButton = document.getElementById("startButton");

startButton.addEventListener("click", function() {

</script>
